apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-damn-vulnerable-defi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbench
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: workbench
  template:
    metadata:
      labels:
        isoloom.com/machine: workbench
        net.isoloom.com/lab: member
    spec:
      hostname: workbench
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      containers:
      - name: workbench
        image: isoloom/damn-vulnerable-defi-workbench
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8545
        - containerPort: 8000
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8545 && /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8000
          periodSeconds: 5
          failureThreshold: 60
        resources:
          limits:
            cpu: '2'
            memory: 2048Mi
        volumeMounts:
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: isoloom-probe
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: workbench
spec:
  selector:
    isoloom.com/machine: workbench
  ports:
  - name: p8545
    port: 8545
    targetPort: 8545
  - name: p8000
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: workbench-published
spec:
  type: LoadBalancer
  selector:
    isoloom.com/machine: workbench
  ports:
  - name: p8545
    port: 8545
    targetPort: 8545
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: publish-workbench
spec:
  podSelector:
    matchLabels:
      isoloom.com/machine: workbench
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 8545
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isoloom-default-deny
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: net-lab
spec:
  podSelector:
    matchLabels:
      net.isoloom.com/lab: member
  ingress:
  - from:
    - podSelector:
        matchLabels:
          net.isoloom.com/lab: member
